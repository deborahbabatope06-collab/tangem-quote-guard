name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --prefer-binary --only-binary=cryptography -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m quote_guard.demo

  setup-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'Windows'
        run: ./scripts/setup.sh --no-mcp
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup.ps1 -NoMcp
